name: Tests end-to-end (dashboard)

# Sert index.html + les vraies data/*.json du repo (aucun mock/fixture) via
# un serveur statique local, comme le flux de verification manuelle utilise
# tout au long du developpement -- voir tests/e2e/smoke.spec.js. Tourne sur
# chaque pull request (le futur garde-fou avant merge) et sur chaque push
# direct sur main (filet de securite pendant la transition vers les PR).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      # data/ vit desormais dans un repo prive separe (12/08/2026) -- voir
      # refresh.yml pour le detail. Lecture seule ici : depth par defaut.
      # Note : si ce workflow tourne un jour sur une PR venant d'un fork
      # (repo de code passe public), les secrets ne sont pas transmis par
      # GitHub -- ce checkout echouerait alors, a traiter separement.
      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
