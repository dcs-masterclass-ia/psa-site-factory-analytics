name: Collecte OEM (Ford)

# Chaque nuit : lit GA4 pour les sites de l'espace OEM (pipeline/oem.py, compte de service OEM distinct du compte Stellantis) et publie data/oem/*.json dans le repo de données privé.
# Secret requis : GA4_OEM_SERVICE_ACCOUNT (contenu JSON de la clé du compte de service OEM). Sans lui le workflow s'arrête sans échec.
on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oem
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: main
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install google-analytics-data==0.18.19 google-auth==2.35.0
      - name: Collecter les sites OEM
        env:
          GA4_OEM_CREDENTIALS: ${{ secrets.GA4_OEM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GA4_OEM_CREDENTIALS" ]; then echo "GA4_OEM_SERVICE_ACCOUNT absent : collecte OEM non configurée"; exit 0; fi
          python -m pipeline.oem --ecrire
      - name: Publier (repo de données)
        working-directory: data
        run: |
          if [ -z "$(git status --porcelain -- oem)" ]; then echo "rien à publier"; exit 0; fi
          git config user.name "converge-auto"; git config user.email "converge-auto@users.noreply.github.com"
          git add oem
          git commit -m "chore(oem): collecte GA4 de l'espace OEM"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
