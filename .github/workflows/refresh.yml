name: Rafraîchissement automatique des données

# Tourne seul, tous les jours (weekend inclus) à minuit.
# 22:00 UTC = minuit à Paris en été, 23:00 en hiver — cron ne gère pas l'heure
# d'été, décalage assumé (même limitation que l'ancien horaire de 9h).
#
# Un seul run couvre les trois sources : BO (leads via leads_extract.py),
# GA4 (funnel, trafic, canaux) et GSC (search_console.py, insights.py).
#
# Écriture incrémentale, site par site (voir pipeline/build.py) : un site
# n'est écrit/commité/poussé que si SES contrôles bloquants passent, et ça ne
# concerne plus que lui — les autres sites du même run sont publiés
# normalement. data/pipeline.json est écrit dans tous les cas : c'est le
# canal d'alerte du dashboard, un échec muet serait pire qu'un échec.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation : calcule et affiche sans rien écrire"
        type: choice
        options: ["non", "oui"]
        default: "non"
      sites:
        description: "Sites à traiter, séparés par une espace (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write          # nécessaire pour committer les données rafraîchies

concurrency:
  group: rafraichissement
  cancel-in-progress: false

jobs:
  rafraichir:
    runs-on: ubuntu-latest
    # 30 min suffisait pour 8 sites sur ~5 mois. Etendu le 07/08/2026 avec le
    # passage a 63 sites sur l'historique complet depuis janvier 2025
    # (DEBUT_HISTORIQUE, pipeline/build.py) : ~30x plus d'appels GA4/GSC.
    timeout-minutes: 340

    steps:
      # jeton personnel plutot que le GITHUB_TOKEN par defaut : Vercel bloque
      # en production tout deploiement pousse par une identite qu'il ne
      # reconnait pas comme collaborateur autorise (ici github-actions[bot]).
      # Le commit du pipeline doit apparaitre comme pousse par un compte
      # deja reconnu pour se deployer automatiquement, sans promotion manuelle.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          python -c "import json,os;json.load(open(os.environ['RUNNER_TEMP']+'/ga4.json'))" \
            || { echo "::error::Le secret n'est pas un JSON valide."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Extraire, contrôler, assembler
        id: build
        env:
          # optionnel comme Search Console lui-meme : absent, insights.py se
          # desactive proprement (liste vide), rien d'autre n'est affecte.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # optionnel comme le reste : absent ou invalide, leads_extract.py
          # degrade site par site vers l'ancien comportement (donnees
          # preservees), rien d'autre n'est affecte.
          LEADS_EXTRACT_TOKEN: ${{ secrets.LEADS_EXTRACT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.sites }}" ]; then ARGS="--sites ${{ inputs.sites }}"; fi
          if [ "${{ inputs.simulation }}" != "oui" ]; then ARGS="$ARGS --ecrire"; fi
          echo "mode : $([ "${{ inputs.simulation }}" = "oui" ] && echo SIMULATION || echo ECRITURE)"
          # build.py ecrit lui-meme le recapitulatif complet dans
          # GITHUB_STEP_SUMMARY au fil de l'execution : rien a extraire ici,
          # et surtout rien a tronquer (un `tail` precedent avait coupe les
          # lignes de decouverte des hotes, les plus utiles a relire).
          #
          # Le commit/push n'est plus une etape separee ici : build.py
          # committe et pousse lui-meme chaque site des qu'il est pret
          # (identite "dcs-masterclass-ia", reconnue par Vercel — memes
          # contraintes qu'avant, juste geree cote Python desormais). Voir
          # _commit_et_pousse dans pipeline/build.py pour la logique de
          # retry/conflit, portee depuis l'ancienne etape bash.
          python -m pipeline.build $ARGS

      - name: Signaler un échec de contrôle
        if: ${{ always() && inputs.simulation != 'oui' }}
        run: |
          if [ ! -f data/pipeline.json ]; then
            echo "::notice::pipeline.json absent (rien n'a ete ecrit, probablement une simulation ou une erreur en amont)."
            exit 0
          fi
          # ne doit jamais faire echouer le job pour son propre compte : c'est
          # une etape de diagnostic, pas un controle bloquant. Un fichier
          # illisible ici (ex. push precedent avorte en plein rebase) doit se
          # signaler proprement plutot que de planter sur le traceback.
          STATUT=$(python -c "
          import json
          try:
              print(json.load(open('data/pipeline.json'))['statut'])
          except Exception as e:
              print(f'illisible:{type(e).__name__}')
          ")
          if [ "$STATUT" = "echec" ]; then
            echo "::warning::Contrôle bloquant sur au moins un site : ses données de la veille ont été conservées (détail dans etat.blocage). Les autres sites du run ont été publiés normalement — écriture incrémentale, ce n'est plus tout ou rien."
          elif [[ "$STATUT" == illisible:* ]]; then
            echo "::warning::pipeline.json illisible a cette etape (${STATUT#illisible:}) — probablement un push avorte juste avant. La donnee sur origin/main n'est pas forcement affectee, mais verifier le job manuellement."
          fi

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4.json"
