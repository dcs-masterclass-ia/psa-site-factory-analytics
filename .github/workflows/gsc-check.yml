name: Diagnostic Search Console

# Lecture seule, declenchement manuel. Deux modes :
#   - sans site_url : liste les proprietes accessibles au compte de service
#     (etape 0 — repond a « avons-nous deja acces a quelque chose ? »)
#   - avec site_url : extrait vue d'ensemble, top requetes, top pages sur la
#     periode donnee (etape 1 — verifie que l'extraction renvoie des chiffres
#     coherents avant de l'assembler dans data/).
# N'ecrit rien dans data/, ne commite rien.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Propriete exacte (vide = liste seulement les proprietes accessibles)"
        required: false
        default: ""
      debut:
        description: "Debut de periode"
        required: false
        default: "2026-07-01"
      fin:
        description: "Fin de periode"
        required: false
        default: "2026-07-31"

permissions:
  contents: read

jobs:
  diagnostiquer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          python -c "import json,os;json.load(open(os.environ['RUNNER_TEMP']+'/ga4.json'))" \
            || { echo "::error::Le secret n'est pas un JSON valide."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Interroger Search Console
        run: |
          SITE_URL="${{ inputs.site_url }}"
          if [ -n "$SITE_URL" ]; then
            python -m pipeline.search_console --sites \
              --site-url "$SITE_URL" --debut "${{ inputs.debut }}" --fin "${{ inputs.fin }}"
          else
            python -m pipeline.search_console --sites
          fi

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4.json"
