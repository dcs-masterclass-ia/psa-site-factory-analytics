name: Sites leads BO seulement (sans GA4)

# Manuel : (re)construit data/<slug>.json des sites presents dans le back-office
# mais sans propriete GA4 (Fiat Pro, Leapmotor, Fiat PL, Lancia LU) et les
# declare dans data/pipeline.json. Le meme module tourne aussi chaque jour
# dans refresh.yml -- ce workflow sert a publier sans attendre ce run (~1 h).
# Voir pipeline/leads_seuls.py.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leads-seuls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Construire les sites leads seuls
        env:
          LEADS_EXTRACT_TOKEN: ${{ secrets.LEADS_EXTRACT_TOKEN }}
        run: python -m pipeline.leads_seuls --ecrire

      - name: Déclencher le redéploiement Vercel
        env:
          SEC_VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$SEC_VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK non configure, redeploiement manuel necessaire."
            exit 0
          fi
          curl -fsS -X POST "$SEC_VERCEL_DEPLOY_HOOK"
