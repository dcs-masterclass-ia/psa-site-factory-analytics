name: Marché automobile (AAA Data, ACEA, DE / IT / ES / UK)

# Collecte mensuelle des immatriculations pour l'onglet « AAA Data » : voir pipeline/market.py.
# Le 2 du mois (communiqué AAA Data du 1er et marchés qui publient tôt) et le 25 (ACEA, publié vers le 20-25).
# Abonnement Claude (claude-code-action + CLAUDE_CODE_OAUTH_TOKEN), aucune clé API.
# Rien n'est écrit sans validation ; un relevé refusé laisse la série existante intacte.
# Manuel : dry_run = collecte et affiche, n'écrit rien.

on:
  schedule:
    - cron: "0 6 2 * *"
    - cron: "0 6 25 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Marchés séparés par des espaces (FR EU DE IT ES PL PT GB) — vide = tous"
        required: false
        default: ""
      dry_run:
        description: "Dry-run : collecte et affiche, n'écrit rien"
        type: choice
        options: ["non", "oui"]
        default: "non"

permissions:
  contents: write
  id-token: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Portugal : lu directement dans les fichiers de l'ACAP (xlsx + pdf), sans agent : toutes les marques, le mix, le cumul
      - name: Collecte directe Portugal (ACAP)
        env:
          IN_SOURCES: ${{ inputs.sources }}
        run: |
          mkdir -p market_in
          case " $IN_SOURCES " in
            "  "|*" PT "*) which pdftotext >/dev/null || sudo apt-get install -y -q poppler-utils; python -m pipeline.market_pt market_in/PT.json || echo "::warning::collecte directe PT en échec" ;;
            *) echo "PT non demandé" ;;
          esac

      - name: Préparer la consigne de l'agent
        id: consigne
        env:
          IN_SOURCES: ${{ inputs.sources }}
        run: |
          ARGS=()
          if [ -n "$IN_SOURCES" ]; then ARGS+=(--sources $IN_SOURCES); fi
          mkdir -p market_in
          {
            echo "texte<<__FIN__"
            python -m pipeline.market --prompt --dossier-sortie market_in "${ARGS[@]}"
            echo "__FIN__"
            echo "outils=$(python -m pipeline.market --outils "${ARGS[@]}")"
          } >> "$GITHUB_OUTPUT"

      # Abonnement Claude (pas de clé API) : l'agent lit les communiqués officiels (WebFetch limité aux domaines des
      # sources) et dépose un JSON par marché dans market_in/. Il ne touche à aucun autre fichier.
      - name: Agent de collecte (abonnement Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.consigne.outputs.texte }}
          claude_args: >-
            --max-turns 120
            --allowedTools "${{ steps.consigne.outputs.outils }}"

      - name: Valider et publier
        env:
          IN_SOURCES: ${{ inputs.sources }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$IN_DRY_RUN" = "oui" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_SOURCES" ]; then ARGS+=(--sources $IN_SOURCES); fi
          ls -la market_in || true
          python -m pipeline.market --lire market_in "${ARGS[@]}"

      - name: Déclencher le redéploiement Vercel
        if: ${{ inputs.dry_run != 'oui' }}
        env:
          SEC_VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$SEC_VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK non configure, redeploiement manuel necessaire."
            exit 0
          fi
          curl -fsS -X POST "$SEC_VERCEL_DEPLOY_HOOK"
