name: Marché automobile (AAA Data, ACEA, DE / IT / ES / UK)

# Collecte mensuelle des immatriculations pour l'onglet « AAA Data » : voir pipeline/market.py.
# Le 2 du mois (communiqué AAA Data du 1er et marchés qui publient tôt) et le 25 (ACEA, publié vers le 20-25).
# Rien n'est écrit sans validation ; un relevé refusé laisse la série existante intacte.
# Manuel : dry_run = collecte et affiche, n'écrit rien.

on:
  schedule:
    - cron: "0 6 2 * *"
    - cron: "0 6 25 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Marchés séparés par des espaces (FR EU DE IT ES GB) — vide = tous"
        required: false
        default: ""
      dry_run:
        description: "Dry-run : collecte et affiche, n'écrit rien"
        type: choice
        options: ["non", "oui"]
        default: "non"

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter le marché
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$IN_DRY_RUN" = "oui" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_SOURCES" ]; then ARGS+=(--sources $IN_SOURCES); fi
          python -m pipeline.market "${ARGS[@]}"

      - name: Déclencher le redéploiement Vercel
        if: ${{ inputs.dry_run != 'oui' }}
        env:
          SEC_VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$SEC_VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK non configure, redeploiement manuel necessaire."
            exit 0
          fi
          curl -fsS -X POST "$SEC_VERCEL_DEPLOY_HOOK"
