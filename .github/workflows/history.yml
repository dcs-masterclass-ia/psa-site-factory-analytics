name: Historique profond (leads BO, GA4, Search Console)

# Manuel : collecte l'historique le plus ancien possible dans le repo de
# donnees, sous data/history/<source>/<site>.csv.gz (CSV compresse, lisible
# par Converge / pandas / Excel). Le dashboard n'y touche pas. Voir
# pipeline/history.py pour les profondeurs et les formats.
# Search Console : chaque passage FUSIONNE avec l'existant (Google ne garde
# que 16 mois) -- a relancer de temps en temps pour archiver.

# Planifie (heures UTC), en mode incremental : seules les dernieres semaines
# sont re-collectees et REMPLACENT la meme fenetre dans les fichiers, l'ancien
# est conserve (pipeline/history.py, remplace_depuis) :
#   - leads BO     : chaque jour 03:20, fenetre 75 jours (requalifications)
#   - GA4          : chaque jour 04:20, fenetre 45 jours
#   - Search Console : chaque lundi 05:20 (fusion avec l'archive ; Google ne
#     garde que 16 mois, une semaine d'ecart ne perd rien)
# Un run manuel garde le comportement d'avant (source / sites / depuis).
on:
  schedule:
    - cron: "20 3 * * *"
    - cron: "20 4 * * *"
    - cron: "20 5 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "Source à collecter"
        type: choice
        options: ["leads", "ga4", "gsc"]
        default: "leads"
      sites:
        description: "Sites (séparés par des virgules ; vide = tous)"
        required: false
        default: ""
      fenetre_jours:
        description: "Mode incrémental : re-collecter seulement les N derniers jours (vide = tout, selon « depuis »)"
        required: false
        default: ""
      depuis:
        description: "Date de début AAAA-MM-JJ (vide = défaut de la source)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run : n'écrit/ne commit rien"
        type: choice
        options: ["non", "oui"]
        default: "non"

permissions:
  contents: write

# jamais deux collectes de la meme source en meme temps (pushes dans le meme repo)
concurrency:
  group: history-${{ inputs.source || github.event.schedule }}
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Collecter l'historique
        env:
          IN_SOURCE: ${{ inputs.source }}
          IN_SITES: ${{ inputs.sites }}
          IN_DEPUIS: ${{ inputs.depuis }}
          IN_FENETRE: ${{ inputs.fenetre_jours }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          LEADS_EXTRACT_TOKEN: ${{ secrets.LEADS_EXTRACT_TOKEN }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "20 3 * * *") IN_SOURCE=leads; IN_FENETRE=75 ;;
              "20 4 * * *") IN_SOURCE=ga4;   IN_FENETRE=45 ;;
              "20 5 * * 1") IN_SOURCE=gsc ;;
              *) echo "::error::cron inconnu : $CRON"; exit 1 ;;
            esac
          fi
          ARGS=("$IN_SOURCE")
          if [ -n "$IN_SITES" ]; then
            ARGS+=(--sites)
            IFS=',' read -ra SITES <<< "$IN_SITES"
            for s in "${SITES[@]}"; do
              s="$(echo "$s" | sed 's/^ *//;s/ *$//')"
              ARGS+=("$s")
            done
          fi
          if [ -n "$IN_FENETRE" ]; then ARGS+=(--fenetre-jours "$IN_FENETRE"); fi
          if [ -n "$IN_DEPUIS" ]; then ARGS+=(--depuis "$IN_DEPUIS"); fi
          if [ "$IN_DRY_RUN" = "oui" ]; then ARGS+=(--dry-run); fi
          python -m pipeline.history "${ARGS[@]}"

      - name: Agréger les leads par mois (data/leads_mensuel.json, lu par le dashboard)
        if: ${{ (inputs.source || '') == 'leads' || github.event.schedule == '20 3 * * *' }}
        run: python -m pipeline.leads_mensuel
