name: Collecte C1ST (quotidienne)

# Collecte les totaux C1ST (leads envoyés, suivi, devis, commandes NSC) par marché, mois et marque -> c1st/kpi.json du repo de données.
# Alimente les diapositives C1ST des présentations (voir pipeline/c1st_collecte.py).
# Chaque nuit à 02:30 UTC (avant le rechargement des jeux C1ST du jour : 04:11 / 07:38 / 11:36 UTC le 15/10/2026, on lit donc l'instantané cohérent de la veille) :
# le mois en cours (partiel : le mois de `collecte.date` n'est jamais utilisé comme complet) + les 3 précédents, recollectés (les commandes sont rattachées au lead jusqu'à 90 jours après).
# Manuel : « depuis » (AAAA-MM) pour un rattrapage plus long.
# Authentification sans navigateur : Connected App OAuth (JWT bearer). Tant que les secrets C1ST_* ne sont pas créés, le workflow
# s'arrête en « non configuré » sans échec (les decks n'affichent simplement pas les diapositives C1ST d'une période absente).

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      depuis:
        description: "Mois de début AAAA-MM (vide = le mois en cours + les 3 précédents)"
        required: false
        default: ""
      pays:
        description: "Marchés (ex. DE,PL,AT,GB ; vide = tous)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: c1st
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: main
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter C1ST
        env:
          C1ST_CLIENT_ID: ${{ secrets.C1ST_CLIENT_ID }}
          C1ST_USERNAME: ${{ secrets.C1ST_USERNAME }}
          C1ST_PRIVATE_KEY: ${{ secrets.C1ST_PRIVATE_KEY }}
          C1ST_LOGIN_URL: ${{ secrets.C1ST_LOGIN_URL }}
          C1ST_AUDIENCE: ${{ secrets.C1ST_AUDIENCE }}
          DEPUIS: ${{ inputs.depuis }}
          PAYS: ${{ inputs.pays }}
        run: |
          set +e
          ARGS="--courant"
          [ -n "$DEPUIS" ] && ARGS="$ARGS --depuis $DEPUIS"
          [ -n "$PAYS" ] && ARGS="$ARGS --pays $PAYS"
          python -m pipeline.c1st_collecte $ARGS
          code=$?
          if [ "$code" -eq 3 ]; then echo "::notice::C1ST non configuré (secrets C1ST_* absents) : rien collecté"; echo "NON_CONFIGURE=1" >> "$GITHUB_ENV"; exit 0; fi
          exit $code

      - name: Publier dans le repo de données
        if: always() && env.NON_CONFIGURE != '1'
        run: |
          cd data
          git config user.name "dcs-masterclass-ia"
          git config user.email "m.foureau@autobiz.com"
          git add c1st/kpi.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "C1ST : collecte quotidienne ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
