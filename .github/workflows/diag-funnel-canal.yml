name: Diagnostic funnel par canal

# Ponctuel, manuel uniquement : funnel etape par etape filtre sur un canal
# GA4 (ex. "Paid Search"), demande a la volee -- le pipeline standard ne
# croise jamais funnel et canal (voir pipeline/_diag_funnel_canal.py).
# Lecture seule, aucune ecriture dans data/.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Slug du site (ex. opel-pt)"
        required: true
      debut:
        description: "Date de debut, YYYY-MM-DD"
        required: true
      fin:
        description: "Date de fin, YYYY-MM-DD"
        required: true
      canal:
        description: "Canal GA4 exact (ex. Paid Search, Organic Search, Direct)"
        required: true
        default: "Paid Search"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          python -c "import json,os; json.load(open(os.environ['RUNNER_TEMP']+'/ga4.json'))" \
            || { echo "::error::Le secret n'est pas un JSON valide."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Funnel filtré par canal
        run: |
          SORTIE="$RUNNER_TEMP/rapport.json"
          python -m pipeline._diag_funnel_canal \
            --site "${{ inputs.site }}" \
            --debut "${{ inputs.debut }}" \
            --fin "${{ inputs.fin }}" \
            --canal "${{ inputs.canal }}" | tee "$SORTIE"
          {
            echo '```json'
            cat "$SORTIE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4.json"
