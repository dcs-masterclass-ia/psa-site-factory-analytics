name: Évènements d'estimation par jour (taux de conversion en sessions)

# À la demande : remplit evDaily pour tous les sites (une requête GA4 par site). Le rafraîchissement nocturne le maintient ensuite.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Slugs séparés par des virgules (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rafraichissement
  cancel-in-progress: false

jobs:
  ev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."; exit 1; fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"
      - name: Collecter
        env:
          IN_SITES: ${{ inputs.sites }}
        run: |
          ARGS=(--ecrire)
          if [ -n "$IN_SITES" ]; then ARGS+=(--sites); IFS=',' read -ra L <<< "$IN_SITES"; for s in "${L[@]}"; do ARGS+=("$(echo "$s" | sed 's/^ *//;s/ *$//')"); done; fi
          python -m pipeline.ev_daily "${ARGS[@]}"
      - name: Redéployer le dashboard (reprend les nouvelles données)
        if: success()
        env:
          SEC_VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -z "$SEC_VERCEL_DEPLOY_HOOK" ] && { echo "::warning::VERCEL_DEPLOY_HOOK non configuré : redéploiement manuel nécessaire."; exit 0; }
          curl -fsS -X POST "$SEC_VERCEL_DEPLOY_HOOK"
