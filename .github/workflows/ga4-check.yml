name: Vérification GA4 (étape 1)

# Étape 1 de l'automatisation : on vérifie seulement que l'API GA4 retrouve les
# chiffres produits à la main. Aucune écriture dans data/, aucun commit.
# Déclenchement manuel uniquement, le temps de valider.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site à vérifier"
        required: true
        default: opel-fr
        type: choice
        options:
          - opel-fr
          - fiat-pt
          - jeep-pt
          - alfa-romeo-pt
          - opel-pt
          - citroen-pt
          - peugeot-pt
      mois:
        description: "Mois, séparés par une espace"
        required: false
        default: "2026-04 2026-05 2026-06 2026-07"

permissions:
  contents: read          # lecture seule : rien ne sera écrit

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."
            exit 1
          fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          python -c "import json,os,sys; json.load(open(os.environ['RUNNER_TEMP']+'/ga4.json'))" \
            || { echo "::error::Le secret n'est pas un JSON valide."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Comparer l'API au fichier en production
        run: |
          python -m pipeline.compare_ga4 \
            --site "${{ inputs.site }}" \
            --mois ${{ inputs.mois }}

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4.json"
