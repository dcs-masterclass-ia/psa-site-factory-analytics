name: Performance PageSpeed Insights

# Hebdomadaire : la performance d'un site ne bouge pas d'un jour a l'autre,
# et chaque audit Lighthouse prend 10 a 30s cote Google (64 sites x 2
# strategies = jusqu'a une heure) -- volontairement separe du rafraichissement
# quotidien (refresh.yml) pour ne pas l'alourdir davantage.
#
# Purement additif : ecrit uniquement la cle "pagespeed" de data/<site>.json,
# jamais le reste (pas de controle bloquant a la build.py, rien d'autre a
# perdre en cas d'echec partiel).

on:
  schedule:
    - cron: "0 4 * * 1"   # lundi 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pagespeed
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mesurer tous les sites
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          if [ -z "$PAGESPEED_API_KEY" ]; then
            echo "::error::Le secret PAGESPEED_API_KEY est vide ou absent."
            exit 1
          fi
          python -m pipeline.pagespeed --tous --ecrire

      - name: Committer si quelque chose a changé
        run: |
          git config user.name "dcs-masterclass-ia"
          git config user.email "m.foureau@autobiz.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement, pas de commit."
            exit 0
          fi
          git commit -m "Performance PageSpeed Insights hebdomadaire"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Echec du push apres 3 tentatives."
          exit 1
