name: Performance PageSpeed Insights

# Manuel uniquement, pas de cron : la mesure se fait a la demande (relevé
# ponctuel a l'instant T, ou plus tard site par site depuis une action du
# dashboard), pas en tache de fond automatique. Chaque audit Lighthouse
# prend 10 a 30s cote Google, x3 par hote/strategie depuis le 10/08/2026
# (garde le run median plutot qu'un essai isole, voir pipeline/pagespeed.py)
# -- jusqu'a plusieurs heures pour tous les sites. Reste separe du
# rafraichissement quotidien (refresh.yml) pour ne pas l'alourdir.
#
# Purement additif : ecrit uniquement la cle "pagespeed" de data/<site>.json,
# jamais le reste (pas de controle bloquant a la build.py). Commit/push SITE
# PAR SITE (pipeline/pagespeed.py, comme backfill_leads.py) : un run
# interrompu en cours de route laisse quand meme publie ce qui a ete mesure.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites a mesurer (slugs separes par un espace, vide = tous)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pagespeed
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mesurer les sites
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          if [ -z "$PAGESPEED_API_KEY" ]; then
            echo "::error::Le secret PAGESPEED_API_KEY est vide ou absent."
            exit 1
          fi
          if [ -n "${{ inputs.sites }}" ]; then
            python -m pipeline.pagespeed --sites ${{ inputs.sites }} --ecrire
          else
            python -m pipeline.pagespeed --tous --ecrire
          fi
          # commit + push site par site geres directement par pipeline/pagespeed.py
          # (via pipeline.build._commit_et_pousse), plus de step separee ici.
