name: Générer une présentation (PowerPoint)

# Déclenché par le dashboard (onglet Présentations, bouton « Générer ») :
# lit le brief dans le repo de données privé, construit le PPTX
# (pipeline/deck) et le dépose dans presentations/out/<id>.pptx du même repo,
# puis passe le brief en « generee » (ou « echec »). Le dashboard le sert par
# /api/presentations?fichier=<id>, jamais en accès public.
on:
  workflow_dispatch:
    inputs:
      brief_id:
        description: "Identifiant du brief (B-…)"
        required: true

permissions:
  contents: read

concurrency:
  group: presentation-${{ inputs.brief_id }}
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: main
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt python-pptx

      - name: Déposer la clé du compte de service
        env:
          CLE: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "::error::Le secret GA4_SERVICE_ACCOUNT est vide ou absent."; exit 1; fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/ga4.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4.json" >> "$GITHUB_ENV"

      - name: Générer le PowerPoint
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: python -m pipeline.deck --briefs data/presentations/briefs.json --id "$BRIEF_ID" --sortie-dir data/presentations/out

      - name: Marquer l'échec
        if: failure()
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: python -m pipeline.deck --briefs data/presentations/briefs.json --id "$BRIEF_ID" --echec || true

      - name: Publier dans le repo de données
        if: always()
        env:
          BRIEF_ID: ${{ inputs.brief_id }}
        run: |
          cd data
          git config user.name "converge-bot"
          git config user.email "converge-bot@users.noreply.github.com"
          git add presentations
          git diff --cached --quiet && exit 0
          git commit -qm "chore(presentations): génération $BRIEF_ID"
          # Plusieurs générations peuvent finir en même temps et toucher toutes briefs.json : en cas de conflit,
          # on repart de la version distante et on y réapplique uniquement l'entrée de CE brief.
          cp presentations/briefs.json /tmp/briefs_mien.json
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch -q origin
            git reset -q --soft origin/HEAD 2>/dev/null || git reset -q --soft "origin/$(git rev-parse --abbrev-ref HEAD)"
            git checkout -q "origin/$(git rev-parse --abbrev-ref HEAD)" -- presentations/briefs.json
            python3 - <<'PY'
          import json, os
          bid = os.environ["BRIEF_ID"]
          mien = json.load(open("/tmp/briefs_mien.json"))
          dist = json.load(open("presentations/briefs.json"))
          cle = "briefs" if isinstance(dist, dict) and "briefs" in dist else None
          lm = mien[cle] if cle else mien
          ld = dist[cle] if cle else dist
          e = next(b for b in lm if b.get("id") == bid)
          ld[:] = [e if b.get("id") == bid else b for b in ld]
          json.dump(dist, open("presentations/briefs.json", "w"), ensure_ascii=False, indent=2)
          PY
            git add presentations
            git commit -qm "chore(presentations): génération $BRIEF_ID" || true
            sleep $((i * 3))
          done
          exit 1
