name: Veille quotidienne Hermès

# Tourne apres le rafraichissement principal (refresh.yml, cron 22:00 UTC,
# desormais ~20-35 min grace au retraitement incremental) : decale de
# 45 min pour lui laisser le temps de finir, sans avoir a coordonner les
# deux plus finement (fichiers distincts : celui-ci n'ecrit jamais dans
# data/<site>.json ni data/pipeline.json, seulement data/hermes_watch.json).
#
# Deux etapes : un pre-tri statistique gratuit (pipeline/watch.py, Python)
# qui repere les sites dont le trafic/les leads ont significativement
# bouge sur 7 jours, puis une analyse narrative (scripts/hermes_watch.js,
# Node, appelle Claude) UNIQUEMENT sur les sites retenus -- jamais les 64
# chaque jour, pour un cout et une duree bornes.

on:
  schedule:
    - cron: "45 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hermes-watch
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # meme jeton que refresh.yml/pagespeed.yml : identite reconnue par
      # Vercel pour le deploiement automatique, cf. commentaire dans
      # refresh.yml pour le detail.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}

      # data/ vit desormais dans un repo prive separe (12/08/2026) -- voir
      # refresh.yml pour le detail.
      - name: Récupérer les données (repo séparé)
        uses: actions/checkout@v4
        with:
          repository: dcs-masterclass-ia/psa-site-factory-data
          path: data
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_PUSH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pré-tri statistique (gratuit, sans appel Claude)
        run: python -m pipeline.watch > "$RUNNER_TEMP/watch_candidats.json"

      - name: Analyse narrative des sites retenus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/hermes_watch.js "$RUNNER_TEMP/watch_candidats.json"

      - name: Committer si quelque chose a changé
        # tourne dans data/ (son propre checkout git depuis le 12/08/2026,
        # repo separe dcs-masterclass-ia/psa-site-factory-data) -- plus dans
        # le repo de code.
        working-directory: data
        run: |
          git config user.name "dcs-masterclass-ia"
          git config user.email "m.foureau@autobiz.com"
          git add hermes_watch.json
          if git diff --cached --quiet; then
            echo "Aucun changement, pas de commit."
            exit 0
          fi
          git commit -m "Veille Hermès quotidienne"
          # meme logique de retry/resolution de conflit que refresh.yml, et
          # meme principe de branche dynamique que pagespeed.yml/build.py :
          # $GITHUB_REF_NAME plutot que "main" en dur, pour ne jamais ecrire
          # sur main depuis un declenchement --ref staging.
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            fi
            CONFLITS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLITS" = "hermes_watch.json" ]; then
              git checkout --theirs hermes_watch.json
              git add hermes_watch.json
              if git rebase --continue && git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
            fi
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          echo "::error::Impossible de pousser après 3 tentatives."
          exit 1

      - name: Déclencher le redéploiement Vercel
        # data/ vit dans un repo separe depuis le 15/08/2026 -- voir
        # refresh.yml pour le detail. Ne tourne que si l'etape precedente
        # a reussi (comportement par defaut d'un step sans "if").
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK non configure, redeploiement manuel necessaire."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
